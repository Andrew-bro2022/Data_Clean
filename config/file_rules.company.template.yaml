# Company deployment template (copy to config/file_rules.yaml).
#
# What was removed vs dev repo:
# - mappings: empty (no _audit_fixtures/ or pipeline_tests/ entries — add your own raw→standard mappings).
# - rules: synthetic regression standards Test_Wide_* and Test_Multi_* removed (not in standards/).
#
# After copy:
# 1) Ensure standards/*.csv match your firm (same filenames as keys under rules).
# 2) Fill mappings and/or raw_prefix_to_standard under config/file_rules.yaml (reader merges from that file, not from this template filename).
# 3) Put production CSV under raw/ (optional: delete raw/_audit_fixtures and raw/pipeline_tests).
#
defaults:
  encoding: utf-8
  delimiter: ','
  skiprows: 0
header_match_threshold: 0.6
mappings: {}
raw_prefix_to_standard:
  SACVA_SENSITIVITY_PREAGGREG_BNS_EXCL_GT_: SACVA_Sensitivity_BNS_r20260217.csv
  SACVA_SENSITIVITY_PREAGGREG_ENTERPRISE_: SACVA_Sensitivity_ENT_r20260217.csv
  MRC_BUSINESS_LINE_STANDALONE_RWA_: MRC_BL_RWA_r20260205.csv
  MRC_BOOK_STANDALONE_RWA_: MRC_Book_RWA_r20260205.csv
  DESK_STANDALONE_RWA_: Desk_RWA_r20260205.csv
  V_SFT_NETSEC_NS_: V_SFT_NETSEC_r20260219.csv
  V_SFT_NFX_IN_OUT_: V_SFT_NFX_r20260219.csv
rules:
  BA_CVA_Allocation_r20260217.csv:
    aliases:
    - BA_CVA_Allocation_r20260217
    read:
      encoding: utf-8
      delimiter: ','
      skiprows: 0
    columns:
    - name: Trade_ID
      type: int
    - name: As_Of_Date
      type: date
      date_format: '%Y-%m-%d'
    - name: Amount
      type: float
    - name: Currency
      type: string
  Book_Sensitivities_r20260205.csv:
